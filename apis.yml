aid: augury
name: Augury
description: >-
  Augury is a New York City-headquartered industrial AI company founded in
  2011 by Gal Shaul and Saar Yoskovitz that profiles itself as the leader in
  Machine Health and Production Health for manufacturing. Its flagship
  offering pairs purpose-built IoT vibration, temperature, and magnetic
  sensors — most prominently the Halo Node and earlier Auguscope hardware —
  with a cloud platform that applies prescriptive AI diagnostics to rotating
  and electrical equipment, advertised as delivering 75% fewer false alarms
  than threshold-based vibration systems and trained on more than one billion
  hours of machine monitoring data. Augury's product portfolio spans Machine
  Health (predictive maintenance for assets such as motors, pumps, fans,
  compressors, and gearboxes), Process Health (process optimization software
  acquired with Seebo in 2022 for yield, waste, and energy improvements), and
  an Industrial AI Workforce of AI agents that act on combined machine and
  operational data. The company runs an integration ecosystem branded
  Augury Plus (CMMS/EAM connectors for SAP PM, IBM Maximo, Infor EAM,
  MaintainX, and cloud/industrial platforms including Microsoft Azure, PTC,
  and AVEVA Connect), Augury On (OEM-embedded Machine Health with partners
  such as Grundfos, Schneider Electric, Trane, Carrier, Bently Nevada, and
  Baker Hughes), and Augury By (service partners including Accenture,
  Deloitte, Bain, McKinsey, Sodexo, Aramark, and AECOM). Augury closed a
  $75M Series F in February 2025 at a $1B+ valuation led by Lightrock with
  Insight Partners, Eclipse, Qumra Capital, La Maison Partners, SE
  Ventures, and Qualcomm Ventures, reports a 5x revenue increase since 2021,
  and serves 170+ global manufacturers across 40+ countries including
  Heineken, PepsiCo (Frito-Lay), Colgate-Palmolive, Shell, and Hershey's.
  The company commercializes through hardware-plus-subscription contracts
  and embedded OEM agreements, references public APIs and certified system
  integrator partners for custom integrations into customer enterprise
  systems, and does not publish an open developer portal, OpenAPI
  description, SDK, or public-facing API reference for the Halo platform.
